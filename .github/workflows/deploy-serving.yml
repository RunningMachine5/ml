name: ML Serving Cloud Run CD

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: Exact MLflow Registry model name to stage
        required: true
        default: fdshield-fraud-detector-v2
        type: string
      model_version:
        description: Exact positive MLflow Registry version to stage at 0% traffic
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ml-serving-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-4cc3406c-72d8-4907-a5d
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: fdshield-ml-serving
  IMAGE_NAME: asia-northeast3-docker.pkg.dev/project-4cc3406c-72d8-4907-a5d/fdshield/ml-serving

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment identity configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || fail "GCP_WORKLOAD_IDENTITY_PROVIDER repository variable is required."
          [[ -n "$DEPLOY_SERVICE_ACCOUNT" ]] || fail "GCP_SERVICE_ACCOUNT repository variable is required."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve serving infrastructure and requested model configuration
        env:
          REQUESTED_MODEL_NAME: ${{ inputs.model_name }}
          REQUESTED_MODEL_VERSION: ${{ inputs.model_version }}
        run: |
          service_config="$RUNNER_TEMP/cloud-run-service.json"
          if ! gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$service_config"; then
            echo "::error::Cloud Run service $CLOUD_RUN_SERVICE must exist and contain the MLflow runtime configuration before deployment."
            exit 1
          fi

          active_revision="$(python3 - "$service_config" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          status = service.get("status", {})
          latest_ready_revision = status.get("latestReadyRevisionName", "")
          revision_percent = {}
          for target in status.get("traffic", []):
              percent = int(target.get("percent", 0) or 0)
              if not percent:
                  continue
              revision = target.get("revisionName", "")
              if not revision and target.get("latestRevision"):
                  revision = latest_ready_revision
              if revision:
                  revision_percent[revision] = revision_percent.get(revision, 0) + percent

          if len(revision_percent) != 1 or sum(revision_percent.values()) != 100:
              raise SystemExit(
                  "::error::Serving code deployment requires exactly one approved "
                  f"100% traffic revision, got {revision_percent}"
              )
          print(next(iter(revision_percent)))
          PY
          )"
          echo "APPROVED_REVISION=$active_revision" >> "$GITHUB_ENV"

          revision_config="$RUNNER_TEMP/cloud-run-active-revision.json"
          gcloud run revisions describe "$active_revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$revision_config"

          python3 - \
            "$active_revision" \
            "$revision_config" \
            "$GITHUB_ENV" \
            "$REQUESTED_MODEL_NAME" \
            "$REQUESTED_MODEL_VERSION" <<'PY'
          import json
          import re
          import sys

          from deploy.serving_revision_contract import (
              ServingRevisionContractError,
              validate_mlflow_tracking_uri,
          )

          (
              active_revision,
              revision_path,
              github_env_path,
              requested_model_name,
              requested_model_version,
          ) = sys.argv[1:]
          revision = json.load(open(revision_path, encoding="utf-8"))
          containers = revision.get("spec", {}).get("containers", [])
          if not containers:
              raise SystemExit("::error::Active Cloud Run revision has no container configuration.")

          environment = {
              item.get("name"): item
              for item in containers[0].get("env", [])
              if item.get("name")
          }
          errors = []
          predictor_mode = "mlflow"
          if not requested_model_name or any(
              char in requested_model_name for char in "\r\n,"
          ):
              errors.append("requested model_name must be a single safe value")
          if not re.fullmatch(r"[1-9][0-9]*", requested_model_version):
              errors.append("requested model_version must be a positive integer")

          tracking_uri = environment.get("MLFLOW_TRACKING_URI", {}).get("value", "")
          try:
              tracking_uri = validate_mlflow_tracking_uri(tracking_uri)
          except ServingRevisionContractError as exc:
              errors.append(str(exc))

          secret_names = {}
          for name in ("MLFLOW_TRACKING_USERNAME", "MLFLOW_TRACKING_PASSWORD"):
              secret_name = (
                  environment.get(name, {})
                  .get("valueFrom", {})
                  .get("secretKeyRef", {})
                  .get("name", "")
              )
              if not re.fullmatch(r"[A-Za-z0-9_-]+", secret_name):
                  errors.append(f"{name} must be connected through Secret Manager")
              else:
                  secret_names[name] = secret_name

          if errors:
              raise SystemExit("::error::" + "; ".join(errors))

          with open(github_env_path, "a", encoding="utf-8") as github_env:
              github_env.write(f"PREDICTOR_MODE={predictor_mode}\n")
              github_env.write(f"MODEL_NAME={requested_model_name}\n")
              github_env.write(f"MODEL_VERSION={requested_model_version}\n")
              github_env.write(f"MLFLOW_TRACKING_URI={tracking_uri}\n")
              github_env.write(
                  "MLFLOW_USERNAME_SECRET="
                  f"{secret_names['MLFLOW_TRACKING_USERNAME']}\n"
              )
              github_env.write(
                  "MLFLOW_PASSWORD_SECRET="
                  f"{secret_names['MLFLOW_TRACKING_PASSWORD']}\n"
              )

          print(
              "Staging requested model without production traffic: "
              f"active_revision={active_revision}, model={requested_model_name}, "
              f"version={requested_model_version}"
          )
          PY

      - name: Build and push immutable image with Cloud Build
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          build_id="$(
            gcloud builds submit \
              --project="$GCP_PROJECT_ID" \
              --config="cloudbuild.serving.yaml" \
              --substitutions="_DEPLOY_IMAGE=$DEPLOY_IMAGE,_PREDICTOR_MODE=$PREDICTOR_MODE,_MODEL_NAME=$MODEL_NAME,_MODEL_VERSION=$MODEL_VERSION,_MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI,_MLFLOW_USERNAME_SECRET=$MLFLOW_USERNAME_SECRET,_MLFLOW_PASSWORD_SECRET=$MLFLOW_PASSWORD_SECRET" \
              --async \
              --format="value(id)" \
              --quiet \
              .
          )"

          if [[ -z "$build_id" ]]; then
            echo "Cloud Build did not return a build ID."
            exit 1
          fi

          echo "Cloud Build submitted: $build_id"
          build_status=""

          for attempt in $(seq 1 120); do
            build_status="$(
              gcloud builds describe "$build_id" \
                --project="$GCP_PROJECT_ID" \
                --format="value(status)"
            )"

            echo "Cloud Build status ($attempt/120): $build_status"

            case "$build_status" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed: $build_status"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [[ "$build_status" != "SUCCESS" ]]; then
            echo "Cloud Build status check timed out."
            exit 1
          fi

      - name: Resolve pushed image digest
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          deploy_digest="$(
            gcloud artifacts docker images describe "$DEPLOY_IMAGE" \
              --project="$GCP_PROJECT_ID" \
              --format="value(image_summary.fully_qualified_digest)"
          )"
          if [[ "$deploy_digest" != "$IMAGE_NAME"@sha256:* ]]; then
            echo "Artifact Registry did not return the expected image digest."
            exit 1
          fi
          echo "DEPLOY_DIGEST=$deploy_digest" >> "$GITHUB_ENV"

      - name: Resolve immutable model version tag
        run: |
          revision_tag="model-v${MODEL_VERSION}"
          tag_check_service="$RUNNER_TEMP/tag-check-service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$tag_check_service"
          echo "REVISION_TAG=$revision_tag" >> "$GITHUB_ENV"
          python3 deploy/serving_revision_contract.py resolve \
            --service "$tag_check_service" \
            --tag "$revision_tag" \
            --github-env "$GITHUB_ENV" \
            --revision-env EXISTING_REVISION \
            --url-env EXISTING_TAGGED_URL

      - name: Reuse exact staged revision or reject model tag collision
        if: env.EXISTING_REVISION != ''
        run: |
          existing_revision_config="$RUNNER_TEMP/existing-tagged-revision.json"
          current_service_config="$RUNNER_TEMP/existing-tagged-service.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$current_service_config"
          gcloud run revisions describe "$EXISTING_REVISION" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$existing_revision_config"

          if ! python3 deploy/serving_revision_contract.py verify \
            --service "$current_service_config" \
            --revision "$existing_revision_config" \
            --expected-revision "$EXISTING_REVISION" \
            --expected-tag "$REVISION_TAG" \
            --expected-digest "$DEPLOY_DIGEST" \
            --expected-mode "$PREDICTOR_MODE" \
            --expected-model-name "$MODEL_NAME" \
            --expected-model-version "$MODEL_VERSION"; then
            echo "::error::$REVISION_TAG already exists with a different or non-staged contract. Model version tags are immutable and will not be moved."
            exit 1
          fi

          echo "Reusing $EXISTING_REVISION for idempotent deployment of $REVISION_TAG."
          echo "SERVING_DEPLOY_MODE=reuse" >> "$GITHUB_ENV"

      - name: Deploy new model version tag without production traffic
        if: env.EXISTING_REVISION == ''
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$DEPLOY_DIGEST" \
            --remove-env-vars="ML_FRAUD_THRESHOLD" \
            --update-env-vars="ML_PREDICTOR_MODE=$PREDICTOR_MODE,ML_MODEL_NAME=$MODEL_NAME,ML_MODEL_VERSION=$MODEL_VERSION" \
            --no-traffic \
            --tag="$REVISION_TAG" \
            --quiet
          echo "SERVING_DEPLOY_MODE=create" >> "$GITHUB_ENV"

      - name: Resolve tagged revision URL
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service.json"
          service_url="$(python3 - "$RUNNER_TEMP/service.json" <<'PY'
          import json
          import sys

          print(json.load(open(sys.argv[1], encoding="utf-8")).get("status", {}).get("url", ""))
          PY
          )"
          test -n "$service_url"
          echo "SERVICE_URL=$service_url" >> "$GITHUB_ENV"
          python3 deploy/serving_revision_contract.py resolve \
            --service "$RUNNER_TEMP/service.json" \
            --tag "$REVISION_TAG" \
            --github-env "$GITHUB_ENV" \
            --revision-env NEW_REVISION \
            --url-env TAGGED_URL \
            --require-present

      - name: Verify tagged revision configuration
        run: |
          revision_config="$RUNNER_TEMP/tagged-revision.json"
          gcloud run revisions describe "$NEW_REVISION" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$revision_config"
          python3 deploy/serving_revision_contract.py verify \
            --service "$RUNNER_TEMP/service.json" \
            --revision "$revision_config" \
            --expected-revision "$NEW_REVISION" \
            --expected-tag "$REVISION_TAG" \
            --expected-digest "$DEPLOY_DIGEST" \
            --expected-mode "$PREDICTOR_MODE" \
            --expected-model-name "$MODEL_NAME" \
            --expected-model-version "$MODEL_VERSION"

      - name: Confirm production traffic was not changed
        run: |
          traffic_config="$RUNNER_TEMP/unchanged-production-traffic.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$traffic_config"
          python3 - "$APPROVED_REVISION" "$NEW_REVISION" "$traffic_config" <<'PY'
          import json
          import sys

          approved_revision, staged_revision, traffic_path = sys.argv[1:]
          status = json.load(open(traffic_path, encoding="utf-8")).get("status", {})
          latest_ready_revision = status.get("latestReadyRevisionName", "")
          revision_percent = {}
          for target in status.get("traffic", []):
              percent = int(target.get("percent", 0) or 0)
              if not percent:
                  continue
              revision = target.get("revisionName", "")
              if not revision and target.get("latestRevision"):
                  revision = latest_ready_revision
              if revision:
                  revision_percent[revision] = revision_percent.get(revision, 0) + percent

          if revision_percent != {approved_revision: 100}:
              raise SystemExit(
                  "::error::Production traffic changed while staging the revision: "
                  f"{revision_percent}"
              )
          print(
              f"Revision {staged_revision} is Ready at 0% traffic and production "
              f"remains on {approved_revision}. Use the Backend approval and smoke "
              "workflow for production promotion."
          )
          PY
