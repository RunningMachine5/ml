name: ML Serving Cloud Run CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ml-serving-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-4cc3406c-72d8-4907-a5d
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: fdshield-ml-serving
  IMAGE_NAME: asia-northeast3-docker.pkg.dev/project-4cc3406c-72d8-4907-a5d/fdshield/ml-serving

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push immutable image with Cloud Build
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          build_id="$(
            gcloud builds submit \
              --project="$GCP_PROJECT_ID" \
              --tag="$DEPLOY_IMAGE" \
              --async \
              --format="value(id)" \
              --quiet \
              .
          )"

          if [[ -z "$build_id" ]]; then
            echo "Cloud Build did not return a build ID."
            exit 1
          fi

          echo "Cloud Build submitted: $build_id"
          build_status=""

          for attempt in $(seq 1 120); do
            build_status="$(
              gcloud builds describe "$build_id" \
                --project="$GCP_PROJECT_ID" \
                --format="value(status)"
            )"

            echo "Cloud Build status ($attempt/120): $build_status"

            case "$build_status" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed: $build_status"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [[ "$build_status" != "SUCCESS" ]]; then
            echo "Cloud Build status check timed out."
            exit 1
          fi

      - name: Deploy image to Cloud Run
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$DEPLOY_IMAGE" \
            --quiet

      - name: Verify deployed revision readiness
        run: |
          for attempt in $(seq 1 12); do
            read -r ready_status latest_created_revision latest_ready_revision < <(
              gcloud run services describe "$CLOUD_RUN_SERVICE" \
                --project="$GCP_PROJECT_ID" \
                --region="$GCP_REGION" \
                --format=json \
                | python3 -c '
          import json
          import sys

          status = json.load(sys.stdin).get("status", {})
          ready_status = next(
              (
                  condition.get("status", "")
                  for condition in status.get("conditions", [])
                  if condition.get("type") == "Ready"
              ),
              "",
          )
          print(
              ready_status,
              status.get("latestCreatedRevisionName", ""),
              status.get("latestReadyRevisionName", ""),
          )
          '
            )

            if [[ "$ready_status" == "True" \
              && -n "$latest_created_revision" \
              && "$latest_created_revision" == "$latest_ready_revision" ]]; then
              echo "Cloud Run revision is ready: $latest_ready_revision"
              exit 0
            fi

            echo "Cloud Run revision is not ready yet ($attempt/12)."
            echo "Ready=$ready_status, created=$latest_created_revision, ready_revision=$latest_ready_revision"
            sleep 5
          done

          echo "Cloud Run revision readiness check failed."
          exit 1
