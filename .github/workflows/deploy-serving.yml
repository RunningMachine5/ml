name: ML Serving Cloud Run CD

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-serving.yml"
      - ".dockerignore"
      - "Dockerfile.serving"
      - "cloudbuild.serving.yaml"
      - "deploy/serving-requirements.txt"
      - "fdshield_ml/__init__.py"
      - "fdshield_ml/features.py"
      - "fdshield_ml/common/**"
      - "fdshield_ml/serving/**"
      - "models/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ml-serving-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-4cc3406c-72d8-4907-a5d
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: fdshield-ml-serving
  IMAGE_NAME: asia-northeast3-docker.pkg.dev/project-4cc3406c-72d8-4907-a5d/fdshield/ml-serving

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deployment identity configuration
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ -n "$WORKLOAD_IDENTITY_PROVIDER" ]] || fail "GCP_WORKLOAD_IDENTITY_PROVIDER repository variable is required."
          [[ -n "$DEPLOY_SERVICE_ACCOUNT" ]] || fail "GCP_SERVICE_ACCOUNT repository variable is required."

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Resolve currently approved model configuration
        run: |
          service_config="$RUNNER_TEMP/cloud-run-service.json"
          if ! gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$service_config"; then
            echo "::error::Cloud Run service $CLOUD_RUN_SERVICE must exist and contain the MLflow runtime configuration before deployment."
            exit 1
          fi

          active_revision="$(python3 - "$service_config" <<'PY'
          import json
          import sys

          service = json.load(open(sys.argv[1], encoding="utf-8"))
          status = service.get("status", {})
          latest_ready_revision = status.get("latestReadyRevisionName", "")
          revision_percent = {}
          for target in status.get("traffic", []):
              percent = int(target.get("percent", 0) or 0)
              if not percent:
                  continue
              revision = target.get("revisionName", "")
              if not revision and target.get("latestRevision"):
                  revision = latest_ready_revision
              if revision:
                  revision_percent[revision] = revision_percent.get(revision, 0) + percent

          if len(revision_percent) != 1 or sum(revision_percent.values()) != 100:
              raise SystemExit(
                  "::error::Serving code deployment requires exactly one approved "
                  f"100% traffic revision, got {revision_percent}"
              )
          print(next(iter(revision_percent)))
          PY
          )"

          revision_config="$RUNNER_TEMP/cloud-run-active-revision.json"
          gcloud run revisions describe "$active_revision" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$revision_config"

          python3 - "$active_revision" "$revision_config" "$GITHUB_ENV" <<'PY'
          import json
          import re
          import sys

          active_revision, revision_path, github_env_path = sys.argv[1:]
          revision = json.load(open(revision_path, encoding="utf-8"))
          containers = revision.get("spec", {}).get("containers", [])
          if not containers:
              raise SystemExit("::error::Active Cloud Run revision has no container configuration.")

          environment = {
              item.get("name"): item
              for item in containers[0].get("env", [])
              if item.get("name")
          }
          errors = []
          predictor_mode = environment.get("ML_PREDICTOR_MODE", {}).get("value", "").lower()
          model_name = environment.get("ML_MODEL_NAME", {}).get("value", "")
          model_version = environment.get("ML_MODEL_VERSION", {}).get("value", "")
          if predictor_mode != "mlflow":
              errors.append("active revision ML_PREDICTOR_MODE must be mlflow")
          if not model_name or any(char in model_name for char in "\r\n,"):
              errors.append("active revision ML_MODEL_NAME must be a single safe value")
          if not re.fullmatch(r"[1-9][0-9]*", model_version):
              errors.append("active revision ML_MODEL_VERSION must be a positive integer")

          tracking_uri = environment.get("MLFLOW_TRACKING_URI", {}).get("value", "")
          if not tracking_uri.startswith(("http://", "https://")) or any(
              char in tracking_uri for char in "\r\n,"
          ):
              errors.append("MLFLOW_TRACKING_URI must be a non-empty HTTP(S) value")

          secret_names = {}
          for name in ("MLFLOW_TRACKING_USERNAME", "MLFLOW_TRACKING_PASSWORD"):
              secret_name = (
                  environment.get(name, {})
                  .get("valueFrom", {})
                  .get("secretKeyRef", {})
                  .get("name", "")
              )
              if not re.fullmatch(r"[A-Za-z0-9_-]+", secret_name):
                  errors.append(f"{name} must be connected through Secret Manager")
              else:
                  secret_names[name] = secret_name

          if errors:
              raise SystemExit("::error::" + "; ".join(errors))

          with open(github_env_path, "a", encoding="utf-8") as github_env:
              github_env.write(f"PREDICTOR_MODE={predictor_mode}\n")
              github_env.write(f"MODEL_NAME={model_name}\n")
              github_env.write(f"MODEL_VERSION={model_version}\n")
              github_env.write(f"MLFLOW_TRACKING_URI={tracking_uri}\n")
              github_env.write(
                  "MLFLOW_USERNAME_SECRET="
                  f"{secret_names['MLFLOW_TRACKING_USERNAME']}\n"
              )
              github_env.write(
                  "MLFLOW_PASSWORD_SECRET="
                  f"{secret_names['MLFLOW_TRACKING_PASSWORD']}\n"
              )

          print(
              "Preserving approved active revision model configuration: "
              f"revision={active_revision}, model={model_name}, version={model_version}"
          )
          PY

      - name: Build and push immutable image with Cloud Build
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          build_id="$(
            gcloud builds submit \
              --project="$GCP_PROJECT_ID" \
              --config="cloudbuild.serving.yaml" \
              --substitutions="_DEPLOY_IMAGE=$DEPLOY_IMAGE,_PREDICTOR_MODE=$PREDICTOR_MODE,_MODEL_NAME=$MODEL_NAME,_MODEL_VERSION=$MODEL_VERSION,_MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI,_MLFLOW_USERNAME_SECRET=$MLFLOW_USERNAME_SECRET,_MLFLOW_PASSWORD_SECRET=$MLFLOW_PASSWORD_SECRET" \
              --async \
              --format="value(id)" \
              --quiet \
              .
          )"

          if [[ -z "$build_id" ]]; then
            echo "Cloud Build did not return a build ID."
            exit 1
          fi

          echo "Cloud Build submitted: $build_id"
          build_status=""

          for attempt in $(seq 1 120); do
            build_status="$(
              gcloud builds describe "$build_id" \
                --project="$GCP_PROJECT_ID" \
                --format="value(status)"
            )"

            echo "Cloud Build status ($attempt/120): $build_status"

            case "$build_status" in
              SUCCESS)
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Cloud Build failed: $build_status"
                exit 1
                ;;
            esac

            sleep 5
          done

          if [[ "$build_status" != "SUCCESS" ]]; then
            echo "Cloud Build status check timed out."
            exit 1
          fi

      - name: Resolve pushed image digest
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          deploy_digest="$(
            gcloud artifacts docker images describe "$DEPLOY_IMAGE" \
              --project="$GCP_PROJECT_ID" \
              --format="value(image_summary.fully_qualified_digest)"
          )"
          if [[ "$deploy_digest" != "$IMAGE_NAME"@sha256:* ]]; then
            echo "Artifact Registry did not return the expected image digest."
            exit 1
          fi
          echo "DEPLOY_DIGEST=$deploy_digest" >> "$GITHUB_ENV"

      - name: Deploy tagged revision without production traffic
        run: |
          revision_tag="model-${GITHUB_SHA::12}"
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$DEPLOY_DIGEST" \
            --remove-env-vars="ML_FRAUD_THRESHOLD" \
            --update-env-vars="ML_PREDICTOR_MODE=$PREDICTOR_MODE,ML_MODEL_NAME=$MODEL_NAME,ML_MODEL_VERSION=$MODEL_VERSION" \
            --no-traffic \
            --tag="$revision_tag" \
            --quiet
          echo "REVISION_TAG=$revision_tag" >> "$GITHUB_ENV"

      - name: Resolve tagged revision URL
        run: |
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$RUNNER_TEMP/service.json"
          read -r service_url tagged_url latest_created_revision < <(
            python3 - "$REVISION_TAG" "$RUNNER_TEMP/service.json" <<'PY'
          import json
          import sys

          tag, path = sys.argv[1:]
          status = json.load(open(path, encoding="utf-8")).get("status", {})
          tagged_url = next(
              (target.get("url", "") for target in status.get("traffic", []) if target.get("tag") == tag),
              "",
          )
          print(status.get("url", ""), tagged_url, status.get("latestCreatedRevisionName", ""))
          PY
          )
          test -n "$service_url"
          test -n "$tagged_url"
          test -n "$latest_created_revision"
          echo "SERVICE_URL=$service_url" >> "$GITHUB_ENV"
          echo "TAGGED_URL=$tagged_url" >> "$GITHUB_ENV"
          echo "NEW_REVISION=$latest_created_revision" >> "$GITHUB_ENV"

      - name: Verify tagged revision configuration
        run: |
          python3 - \
            "$NEW_REVISION" \
            "$REVISION_TAG" \
            "$DEPLOY_DIGEST" \
            "$PREDICTOR_MODE" \
            "$MODEL_NAME" \
            "$MODEL_VERSION" \
            "$RUNNER_TEMP/service.json" <<'PY'
          import json
          import sys

          (
              expected_revision,
              expected_tag,
              expected_digest,
              expected_mode,
              expected_name,
              expected_version,
              service_path,
          ) = sys.argv[1:]
          service = json.load(open(service_path, encoding="utf-8"))
          status = service.get("status", {})
          if status.get("latestReadyRevisionName") != expected_revision:
              raise SystemExit("::error::New revision is not the latest ready revision")

          tagged_target = next(
              (
                  target
                  for target in status.get("traffic", [])
                  if target.get("tag") == expected_tag
              ),
              {},
          )
          if tagged_target.get("revisionName") != expected_revision:
              raise SystemExit("::error::Revision tag does not target the new revision")

          containers = (
              service.get("spec", {})
              .get("template", {})
              .get("spec", {})
              .get("containers", [])
          )
          if not containers or containers[0].get("image") != expected_digest:
              raise SystemExit("::error::New revision does not use the verified image digest")

          environment = {
              item.get("name"): item.get("value")
              for item in containers[0].get("env", [])
              if item.get("name")
          }
          expected_environment = {
              "ML_PREDICTOR_MODE": expected_mode,
              "ML_MODEL_NAME": expected_name,
              "ML_MODEL_VERSION": expected_version,
          }
          if any(
              environment.get(name) != value
              for name, value in expected_environment.items()
          ):
              raise SystemExit("::error::New revision model configuration is incorrect")
          if "ML_FRAUD_THRESHOLD" in environment:
              raise SystemExit("::error::Legacy fraud threshold environment remains")

          print("Tagged revision uses the Cloud Build-smoked digest and exact model config.")
          PY

      - name: Migrate all production traffic to verified revision
        run: |
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --to-tags="$REVISION_TAG=100" \
            --quiet

      - name: Verify production traffic target
        run: |
          traffic_config="$RUNNER_TEMP/production-traffic.json"
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json > "$traffic_config"
          python3 - "$NEW_REVISION" "$traffic_config" <<'PY'
          import json
          import sys

          expected_revision, traffic_path = sys.argv[1:]
          status = json.load(open(traffic_path, encoding="utf-8")).get("status", {})
          revision_percent = {}
          for target in status.get("traffic", []):
              revision = target.get("revisionName", "")
              percent = int(target.get("percent", 0) or 0)
              if revision and percent:
                  revision_percent[revision] = revision_percent.get(revision, 0) + percent

          if revision_percent != {expected_revision: 100}:
              raise SystemExit(
                  "::error::Production traffic target mismatch: "
                  f"expected {{{expected_revision!r}: 100}}, got {revision_percent}"
              )
          print(f"Production traffic migrated to {expected_revision}.")
          PY
