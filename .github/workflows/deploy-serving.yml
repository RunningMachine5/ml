name: ML Serving Cloud Run CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ml-serving-cloud-run
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: project-4cc3406c-72d8-4907-a5d
  GCP_REGION: asia-northeast3
  CLOUD_RUN_SERVICE: fdshield-ml-serving
  IMAGE_NAME: asia-northeast3-docker.pkg.dev/project-4cc3406c-72d8-4907-a5d/fdshield/ml-serving

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run python -m pytest

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push immutable image with Cloud Build
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud builds submit \
            --project="$GCP_PROJECT_ID" \
            --tag="$DEPLOY_IMAGE" \
            --quiet \
            .

      - name: Deploy image to Cloud Run
        env:
          DEPLOY_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          gcloud run services update "$CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$DEPLOY_IMAGE" \
            --quiet

      - name: Verify deployed revision readiness
        run: |
          service_url="$(
            gcloud run services describe "$CLOUD_RUN_SERVICE" \
              --project="$GCP_PROJECT_ID" \
              --region="$GCP_REGION" \
              --format='value(status.url)'
          )"
          test -n "$service_url"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --max-time 10 \
              "$service_url/ready"; then
              echo
              echo "ML Serving readiness check succeeded: $service_url/ready"
              exit 0
            fi

            echo "ML Serving is not ready yet ($attempt/12); retrying in 5 seconds."
            sleep 5
          done

          echo "ML Serving readiness check failed: $service_url/ready"
          exit 1
