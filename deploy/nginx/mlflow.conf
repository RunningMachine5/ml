# Certbot의 HTTP-01 검증 경로만 HTTP로 제공하고 나머지는 HTTPS로 전환합니다.
server {
    listen 80;
    listen [::]:80;
    server_name fdshield.cloud www.fdshield.cloud mlflow.fdshield.cloud api.fdshield.cloud;

    # Certbot과 Nginx가 공유하는 Webroot 볼륨에서 인증용 임시 파일을 읽습니다.
    # 이 경로까지 HTTPS로 리다이렉트하면 인증서 발급·갱신에 실패할 수 있습니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# React/Vite Frontend
#
# 브라우저는 같은 출처의 상대경로만 호출하고, Nginx가 필요한 요청만 Backend로 전달합니다.
# 따라서 프론트 개발자는 배포용 API 환경변수를 별도로 관리하지 않아도 됩니다.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fdshield.cloud www.fdshield.cloud;

    # Certbot이 네 공개 도메인을 함께 발급한 SAN 인증서를 사용합니다.
    ssl_certificate /etc/letsencrypt/live/mlflow.fdshield.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.fdshield.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/frontend/current;
    index index.html;

    # EventSource 연결은 오래 유지되므로 응답 버퍼링과 짧은 timeout을 사용하지 않습니다.
    location = /api/dashboard/events {
        proxy_pass http://backend:8000/api/dashboard/events;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 화면 주소 /chat/{id}와 Backend의 /chat API가 충돌하지 않도록
    # 프론트가 붙인 /api 접두어만 제거합니다.
    location ^~ /api/chat/ {
        rewrite ^/api/chat(/.*)$ /chat$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/agent/ {
        rewrite ^/api/agent(/.*)$ /agent$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 룰·모델 관리 화면은 /api 아래의 같은 출처로 요청하고,
    # Backend 관리자 라우터가 사용하는 실제 prefix로 전달합니다.
    location ^~ /api/mlops {
        rewrite ^/api/mlops(.*)$ /mlops$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-MLOps-Admin-Token "${MLOPS_ADMIN_TOKEN}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/rule-sets {
        rewrite ^/api/rule-sets(.*)$ /rule-sets$1 break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-MLOps-Admin-Token "${MLOPS_ADMIN_TOKEN}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/rule-features {
        rewrite ^/api/rule-features$ /rule-features break;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-MLOps-Admin-Token "${MLOPS_ADMIN_TOKEN}";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dashboard와 Agent Case API는 Backend도 /api 경로를 사용합니다.
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 처리 큐와 상세 화면이 조회하는 거래 API입니다.
    location ^~ /transactions {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router의 /queue, /cases, /chat/{id}를 새로고침해도 index.html로 진입합니다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# MLflow Tracking UI/API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mlflow.fdshield.cloud;

    ssl_certificate /etc/letsencrypt/live/mlflow.fdshield.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.fdshield.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # XGBoost Pipeline과 환경 정보를 포함한 모델 artifact 업로드를 허용합니다.
    client_max_body_size 500M;

    # 모델 업로드나 MLflow API 응답이 일반 웹 요청보다 오래 걸릴 수 있습니다.
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # Compose가 만든 내부 DNS에서 mlflow 서비스 이름을 찾습니다.
        proxy_pass http://mlflow:5000;
        proxy_http_version 1.1;

        # MLflow가 원래 요청의 도메인, IP, 프로토콜을 알 수 있도록 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# FastAPI Backend
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fdshield.cloud;

    # 두 도메인을 함께 발급한 SAN 인증서이므로 같은 파일을 사용합니다.
    ssl_certificate /etc/letsencrypt/live/mlflow.fdshield.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.fdshield.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # 기존 팀 공유용 정적 시안. 정식 React 앱과 별개로 /preview/ 경로를 보존합니다.
    location = /preview {
        return 302 /preview/;
    }

    location ^~ /preview/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
