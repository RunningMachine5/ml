# MLflow는 Docker 네트워크 안의 5000번 포트로만 통신하고,
# 외부 요청은 이 Nginx를 통해서만 전달합니다.
#
# 현재 파일은 Let's Encrypt 인증서를 발급하기 전 사용할 HTTP 부트스트랩
# 설정입니다. 인증서 발급 후 80 -> 443 리다이렉트와 TLS 설정을 추가합니다.
server {
    listen 80;
    listen [::]:80;
    server_name mlflow.fdshield.cloud;

    # XGBoost Pipeline과 환경 정보를 포함한 모델 artifact 업로드를 허용합니다.
    client_max_body_size 500M;

    # 모델 업로드나 MLflow API 응답이 일반 웹 요청보다 오래 걸릴 수 있습니다.
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # Compose가 만든 내부 DNS에서 mlflow 서비스 이름을 찾습니다.
        proxy_pass http://mlflow:5000;
        proxy_http_version 1.1;

        # MLflow가 원래 요청의 도메인, IP, 프로토콜을 알 수 있도록 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
