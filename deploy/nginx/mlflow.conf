# Certbot의 HTTP-01 검증 경로만 HTTP로 제공하고 나머지는 HTTPS로 전환합니다.
server {
    listen 80;
    listen [::]:80;
    server_name mlflow.fdshield.cloud api.fdshield.cloud;

    # Certbot과 Nginx가 공유하는 Webroot 볼륨에서 인증용 임시 파일을 읽습니다.
    # 이 경로까지 HTTPS로 리다이렉트하면 인증서 발급·갱신에 실패할 수 있습니다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# MLflow Tracking UI/API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mlflow.fdshield.cloud;

    ssl_certificate /etc/letsencrypt/live/mlflow.fdshield.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.fdshield.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # XGBoost Pipeline과 환경 정보를 포함한 모델 artifact 업로드를 허용합니다.
    client_max_body_size 500M;

    # 모델 업로드나 MLflow API 응답이 일반 웹 요청보다 오래 걸릴 수 있습니다.
    proxy_connect_timeout 10s;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # Compose가 만든 내부 DNS에서 mlflow 서비스 이름을 찾습니다.
        proxy_pass http://mlflow:5000;
        proxy_http_version 1.1;

        # MLflow가 원래 요청의 도메인, IP, 프로토콜을 알 수 있도록 전달합니다.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# FastAPI Backend
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.fdshield.cloud;

    # 두 도메인을 함께 발급한 SAN 인증서이므로 같은 파일을 사용합니다.
    ssl_certificate /etc/letsencrypt/live/mlflow.fdshield.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mlflow.fdshield.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
