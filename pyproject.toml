[project]
name = "fdshield-ml"
version = "0.1.0"
description = "FDShield fraud-detection model comparison and MLflow integration"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlflow==3.13.0",
    "pandas>=2.3,<4",
    "python-dotenv>=1.1,<2",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
