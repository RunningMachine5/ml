services:
  ml-serving:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ML_SERVING_IMAGE:-fdshield/ml-serving:local}
    container_name: fdshield-ml-serving-container
    restart: unless-stopped
    environment:
      PORT: "8080"
      ML_FRAUD_THRESHOLD: ${ML_FRAUD_THRESHOLD:-0.55}
      ML_MODEL_NAME: fdshield-rule-based-stub
      ML_MODEL_VERSION: "0"
    ports:
      - "${ML_SERVING_PORT:-8001}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
