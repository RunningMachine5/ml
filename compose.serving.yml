services:
  ml-serving:
    build:
      context: .
      dockerfile: Dockerfile.serving
    image: ${ML_SERVING_IMAGE:-fdshield/ml-serving:local}
    container_name: fdshield-ml-serving-container
    restart: unless-stopped
    environment:
      PORT: "8080"
      ML_PREDICTOR_MODE: ${ML_PREDICTOR_MODE:-local}
      ML_LOCAL_MODEL_PATH: ${ML_LOCAL_MODEL_PATH:-/app/models/fdshield-fraud-detector-v5}
      ML_MODEL_NAME: ${ML_MODEL_NAME:-}
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
    ports:
      - "${ML_SERVING_PORT:-8001}:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
